# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Database Configuration
# Defaults to H2 (MySQL Mode) for instant cloud startup; set SPRING_DATASOURCE_URL to use external MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:attendance_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 Console Settings
spring.h2.console.enabled=true

# Hibernate / JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/
spring.application.name=Smart Attendance System

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGenerationAndValidation123456789}
app.jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.smartsyatem=DEBUG
