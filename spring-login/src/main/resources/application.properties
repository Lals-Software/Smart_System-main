# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Database Configuration
# Supports Railway MySQL variables (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD),
# custom SPRING_DATASOURCE_URL, or H2 in-memory fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${MYSQLURL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:attendance_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:Lali@30~03~2006##}}}

# Hibernate / JPA properties & automatic data import
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/
spring.application.name=Smart Attendance System

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGenerationAndValidation123456789}
app.jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.smartsyatem=DEBUG
