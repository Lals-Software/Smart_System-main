<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Smart Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-color: #333;
            --input-bg: #f5f7fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .register-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { color: var(--text-color); font-size: 1.8rem; margin-bottom: 0.5rem; }
        .header p { color: #666; font-size: 0.9rem; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-color); font-weight: 500; font-size: 0.9rem; }
        
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: var(--input-bg);
            font-size: 1rem;
            color: var(--text-color);
        }

        .role-toggle {
            display: flex;
            background: #f0f2f5;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .role-btn.active {
            background: white;
            color: var(--primary-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }

        .btn-register:hover { background-color: var(--primary-hover); }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .login-link a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="header">
            <i class="fas fa-user-plus fa-3x" style="color: var(--primary-color); margin-bottom: 10px;"></i>
            <h1>Student Registration</h1>
            <p>Create your account to access the portal</p>
        </div>

        <div class="role-toggle">
            <button type="button" class="role-btn active" onclick="setRole('student')">Student</button>
            <button type="button" class="role-btn" onclick="setRole('staff')">Staff</button>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" required>
            </div>

            <!-- Student Fields -->
            <div id="studentFields">
                <div class="form-group">
                <label>Register Number</label>
                <input type="text" id="regNo" class="form-control" placeholder="e.g., 91762314001" required>
            </div>

            <div class="form-group">
                <label>Batch</label>
                <select id="classId" class="form-control" required>
                    <option value="">Loading batches...</option>
                </select>
            </div>
            </div>

            <!-- Staff Fields -->
            <div id="staffFields" style="display: none;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="staff@college.edu">
                </div>
                
                <div class="form-group">
                    <label>Primary Teaching Assignment</label>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <input type="text" id="staffSubject" class="form-control" placeholder="Subject" style="flex: 1;">
                        <select id="staffClassId" class="form-control" style="flex: 1;">
                            <option value="">Batch</option>
                        </select>
                    </div>
                    <select id="staffSemester" class="form-control">
                        <option value="">Select Semester</option>
                        <option value="1">Sem 1</option>
                        <option value="2">Sem 2</option>
                        <option value="3">Sem 3</option>
                        <option value="4">Sem 4</option>
                        <option value="5">Sem 5</option>
                        <option value="6">Sem 6</option>
                        <option value="7">Sem 7</option>
                        <option value="8">Sem 8</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn-register">Register</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        let currentRole = 'student';

        // Fetch classes on load
        document.addEventListener('DOMContentLoaded', async () => {
            const classes = JSON.parse(localStorage.getItem('smartAttendance_classes')) || [];
            const options = classes.length ? classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('') : '<option value="">No batches found</option>';            
            document.getElementById('classId').innerHTML = options;
            document.getElementById('staffClassId').innerHTML = '<option value="">Select Batch</option>' + options;
        });

        function setRole(role) {
            currentRole = role;
            const btns = document.querySelectorAll('.role-btn');
            btns.forEach(b => b.classList.remove('active'));
            
            if (role === 'student') {
                btns[0].classList.add('active');
                document.getElementById('studentFields').style.display = 'block';
                document.getElementById('staffFields').style.display = 'none';
                document.getElementById('regNo').required = true;
                document.getElementById('email').required = false;
            } else {
                btns[1].classList.add('active');
                document.getElementById('studentFields').style.display = 'none';
                document.getElementById('staffFields').style.display = 'block';
                document.getElementById('regNo').required = false;
                document.getElementById('email').required = true;
            }
        }

        async function handleRegister(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.querySelector('.btn-register');

            const originalText = btn.innerText;
            btn.innerText = 'Registering...';
            btn.disabled = true;

            setTimeout(() => {
                const users = JSON.parse(localStorage.getItem('smartAttendance_users')) || [];
                let newUser = null;
                
                if (currentRole === 'student') {
                    const regNo = document.getElementById('regNo').value.trim();
                    const classId = document.getElementById('classId').value;
                    
                    if (users.some(u => u.regNo === regNo)) {
                        alert('Student with this Register No already exists.');
                        btn.innerText = originalText;
                        btn.disabled = false;
                        return;
                    }
                    newUser = {
                        id: Date.now(), name, role: 'student', regNo, classId, password, is_approved: true
                    };
                } else {
                    const email = document.getElementById('email').value.trim();
                    const subject = document.getElementById('staffSubject').value.trim();
                    const classId = document.getElementById('staffClassId').value;
                    const semester = document.getElementById('staffSemester').value;

                    if (users.some(u => u.email === email)) {
                        alert('Staff with this Email already exists.');
                        btn.innerText = originalText;
                        btn.disabled = false;
                        return;
                    }
                    newUser = {
                        id: Date.now(), name, role: 'staff', email, password, is_approved: true,
                        subject: subject, // Legacy support
                        teachingAssignments: [{ subject, classId, semester }]
                    };
                }

                if (newUser) {
                    users.push(newUser);
                    localStorage.setItem('smartAttendance_users', JSON.stringify(users));
                    alert('Registration successful.');
                    window.location.href = 'login.html';
                }

                btn.innerText = originalText;
                btn.disabled = false;
            }, 500);
        }
    </script>
</body>
</html>
