<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Smart Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="staff_settings.css">
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --error-color: #e74c3c;
            --success-color: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .dashboard-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
            font-weight: 600;
            font-size: 1rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn.secondary {
            background: #6c757d;
        }
        .btn.secondary:hover {
            background: #5a6268;
        }

        .settings-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .settings-card h2 {
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }
        .message.error {
            background-color: #fdedec;
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }
        .message.success {
            background-color: #e9f9f0;
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="header">
            <h1>Profile Settings</h1>
            <a href="staff_dashboard.html" class="btn secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </header>

        <main>
            <div class="settings-card">
                <h2 class="section-title">Change Password</h2>
                
                <div id="status-message" class="message"></div>

                <form id="password-form">
                    <div class="form-group">
                        <label for="current-password">Current Password</label>
                        <input type="password" id="current-password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn">Update Password</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('password-form');
        const messageDiv = document.getElementById('status-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPass = document.getElementById('current-password').value;
            const newPass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;

            // Simple validation
            if (newPass !== confirmPass) {
                showMessage('New passwords do not match.', 'error');
                return;
            }

            if (newPass.length < 6) {
                showMessage('Password must be at least 6 characters long.', 'error');
                return;
            }

            const btn = form.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Updating...';
            btn.disabled = true;

            const currentUser = JSON.parse(sessionStorage.getItem('smartAttendance_currentUser'));
            if (!currentUser || currentUser.role.toLowerCase() !== 'staff') {
                showMessage('Error: User session not found. Please login again.', 'error');
                btn.innerText = originalText;
                btn.disabled = false;
                return;
            }

            // Assuming an API_BASE is defined globally or passed
            const API_BASE = "http://localhost:8081/api";
            const token = sessionStorage.getItem('auth_token');

            fetch(`${API_BASE}/staff/profile/${currentUser.username}`, { // Assuming username is email for staff
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ ...currentUser, password: newPass }) 
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => Promise.reject(err));
                }
                return response.json();
            })
            .then(data => {
                    showMessage('Password updated successfully!', 'success');
                    form.reset();
            })
            .catch(error => {
                showMessage(error.message || 'Failed to update password. Invalid current password or server error.', 'error');
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
